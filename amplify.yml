# AWS Amplify Hosting — static UI from frontend/
# Backend (FastAPI) is not hosted by Amplify; deploy it separately (App Runner, ECS, Lambda, etc.)
# and set Amplify environment variable BETTOR_API_URL to that API origin (no trailing slash).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          if [ -n "$BETTOR_API_URL" ]; then
            printf "/**\n * Injected by Amplify preBuild (BETTOR_API_URL).\n */\nexport const API_BASE = '%s';\n" "${BETTOR_API_URL%/}" > frontend/assets/js/config.js
            echo "BETTOR_API_URL is set; config.js will call the remote API."
          else
            echo "WARNING: BETTOR_API_URL is not set. The deployed site will request /api/* on Amplify and get 404 unless you add BETTOR_API_URL here or a reverse-proxy rule to your FastAPI backend."
          fi
    build:
      commands:
        - mkdir -p frontend/how-it-works frontend/supported-leagues
        - cp frontend/how-it-works.html frontend/how-it-works/index.html
        - cp frontend/supported-leagues.html frontend/supported-leagues/index.html
  artifacts:
    baseDirectory: frontend
    files:
      - "**/*"
  cache:
    paths: []
# Optional: add HSTS / security headers in Amplify Console → Hosting → Custom headers
