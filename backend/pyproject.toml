[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
    # Broad except clauses are used intentionally for ZoneInfo fallback in a few places.
    "BLE001",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Scope: core app and services packages only.
files = ["app", "services"]
